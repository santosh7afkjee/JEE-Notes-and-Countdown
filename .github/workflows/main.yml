
name: Build JEE Notes and Countdown APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project ZIP
        run: |
          unzip -q JEEultimateapp.zip -d extracted
          APP_DIR="$(dirname "$(find extracted -type f -name package.json -print -quit)")"
          test -f "$APP_DIR/capacitor.config.json"
          test -d "$APP_DIR/www"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$APP_DIR" && npm install

      - name: Generate Android project
        run: cd "$APP_DIR" && npx cap add android

      - name: Sync app
        run: cd "$APP_DIR" && npx cap sync android

      - name: Build APK
        run: cd "$APP_DIR/android" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: final-innings-debug-apk
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
